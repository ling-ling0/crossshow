# CrossShow 单实例部署（开发文档 9.1）。
# 一个应用容器 + 持久化数据卷；数据库不独立开放端口；健康检查 + 优雅关闭。
# 构建上下文为仓库根目录：docker compose -f deploy/docker-compose.yml up -d --build
services:
  crossshow-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: crossshow-api:0.1.0
    container_name: crossshow-api
    restart: unless-stopped
    ports:
      - "${CROSSSHOW_PUBLIC_PORT:-8080}:8080"
    environment:
      CROSSSHOW_LISTEN_ADDR: ":8080"
      CROSSSHOW_DB_PATH: /data/crossshow.db
      CROSSSHOW_DEFAULT_TIMEZONE: ${CROSSSHOW_DEFAULT_TIMEZONE:-Asia/Shanghai}
      CROSSSHOW_LOG_LEVEL: ${CROSSSHOW_LOG_LEVEL:-info}
      # 优雅关闭等待上限，配合应用内 in-flight 请求收尾
      CROSSSHOW_SHUTDOWN_TIMEOUT: ${CROSSSHOW_SHUTDOWN_TIMEOUT:-15s}
    volumes:
      - crossshow-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 20s

volumes:
  crossshow-data:
